<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | Sharif Group</title>
  <base href="/admin/">
  <link rel="icon" href="/assets/images/shariftrip-logo-1.svg?v=20261117" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400&display=swap"
    rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --gold: #786142;
      --gold-light: #9A7D58;
      --gold-bright: #B8976A;
      --gold-glow: rgba(120, 97, 66, 0.30);
      --bg: #0E0F12;
      --surface: #161820;
      --card: #1C1E24;
      --border: rgba(120, 97, 66, 0.22);
      --cream: #FAF6EE;
      --text: #ECEAE6;
      --muted: #9A9490;
    }

    html,
    body {
      height: 100%;
      min-height: 100vh;
      font-family: 'Inter', -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
    }

    /* ── BACKGROUND PATTERN ── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 60% 50% at 20% 50%, rgba(120, 97, 66, 0.08) 0%, transparent 60%),
        radial-gradient(ellipse 50% 60% at 80% 50%, rgba(120, 97, 66, 0.05) 0%, transparent 55%);
      pointer-events: none;
      z-index: 0;
    }

    /* ── WRAPPER ── */
    .login-wrap {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }

    /* ── LOGIN CARD ── */
    .login-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      width: 100%;
      max-width: 440px;
      padding: 48px 44px;
      box-shadow: 0 32px 80px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(120, 97, 66, 0.10);
      animation: cardIn 0.55s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes cardIn {
      from {
        opacity: 0;
        transform: translateY(24px) scale(0.97);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* ── BRAND HEADER ── */
    .brand {
      text-align: center;
      margin-bottom: 36px;
    }

    .brand-logo {
      height: 56px;
      width: auto;
      object-fit: contain;
      margin-bottom: 16px;
      filter: brightness(1.1);
    }

    .brand-name {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 22px;
      font-weight: 700;
      color: var(--cream);
      letter-spacing: 0.02em;
      line-height: 1.2;
    }

    .brand-name span {
      color: var(--gold-bright);
    }

    .brand-sub {
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      margin-top: 6px;
    }

    /* ── GOLD DIVIDER ── */
    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 32px;
    }

    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .divider-dot {
      width: 5px;
      height: 5px;
      background: var(--gold);
      border-radius: 50%;
    }

    /* ── FORM ── */
    .form-group {
      margin-bottom: 20px;
    }

    .form-label {
      display: block;
      font-size: 11.5px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .input-wrap {
      position: relative;
    }

    .input-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 14px;
      color: var(--gold);
      pointer-events: none;
    }

    .form-input {
      width: 100%;
      padding: 13px 42px;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      transition: border-color 0.2s, box-shadow 0.2s;
      outline: none;
      -webkit-appearance: none;
    }

    .form-input::placeholder {
      color: #4A4845;
    }

    .form-input:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 3px var(--gold-glow);
    }

    /* password toggle */
    .toggle-pass {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      font-size: 14px;
      padding: 2px;
      transition: color 0.2s;
    }

    .toggle-pass:hover {
      color: var(--gold-bright);
    }

    /* ── SIGN IN BUTTON ── */
    .btn-signin {
      width: 100%;
      padding: 14px;
      background: var(--gold);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.04em;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
      margin-top: 28px;
      box-shadow: 0 4px 20px rgba(120, 97, 66, 0.35);
    }

    .btn-signin:hover:not(:disabled) {
      background: var(--gold-light);
      transform: translateY(-1px);
      box-shadow: 0 8px 28px rgba(120, 97, 66, 0.45);
    }

    .btn-signin:active:not(:disabled) {
      transform: translateY(0);
    }

    .btn-signin:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* ── ERROR ALERT ── */
    .alert-error {
      display: none;
      background: rgba(220, 38, 38, 0.10);
      border: 1px solid rgba(220, 38, 38, 0.30);
      border-radius: 8px;
      padding: 11px 14px;
      font-size: 13px;
      color: #FCA5A5;
      margin-top: 16px;
      align-items: center;
      gap: 8px;
    }

    .alert-error.show {
      display: flex;
    }

    /* ── FOOTER ── */
    .card-footer {
      text-align: center;
      margin-top: 28px;
      font-size: 11.5px;
      color: #4A4845;
      letter-spacing: 0.03em;
    }

    /* ── SPINNER ── */
    .spinner {
      display: none;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .btn-signin.loading .btn-label {
      display: none;
    }

    .btn-signin.loading .btn-icon {
      display: none;
    }

    .btn-signin.loading .spinner {
      display: block;
    }
  </style>
</head>

<body>

  <div class="login-wrap">
    <div class="login-card">

      <!-- Brand -->
      <div class="brand">
        <img src="/assets/images/shariftrip-logo-1.svg?v=20261117" alt="Sharif Group" class="brand-logo"
          onerror="this.style.display='none'">
        <div class="brand-name">Sharif <span>Group</span></div>
        <div class="brand-sub">Admin Portal</div>
      </div>

      <!-- Divider -->
      <div class="divider">
        <div class="divider-dot"></div>
      </div>

      <!-- Login Form -->
      <form id="loginForm" autocomplete="on" novalidate>

        <div class="form-group">
          <label class="form-label" for="emailField">Email Address</label>
          <div class="input-wrap">
            <i class="fa-regular fa-envelope input-icon"></i>
            <input id="emailField" type="email" class="form-input" placeholder="admin@sharifgroup.ae"
              autocomplete="email" required>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="passField">Password</label>
          <div class="input-wrap">
            <i class="fa-solid fa-lock input-icon"></i>
            <input id="passField" type="password" class="form-input" placeholder="••••••••••••"
              autocomplete="current-password" required>
            <button type="button" class="toggle-pass" id="togglePass" aria-label="Toggle password">
              <i class="fa-regular fa-eye" id="toggleIcon"></i>
            </button>
          </div>
        </div>

        <div class="alert-error" id="alertError" role="alert">
          <i class="fa-solid fa-circle-exclamation"></i>
          <span id="alertMsg">Incorrect email or password.</span>
        </div>

        <button type="submit" class="btn-signin" id="signInBtn">
          <i class="fa-solid fa-right-to-bracket btn-icon"></i>
          <span class="btn-label">Sign In</span>
          <div class="spinner"></div>
        </button>

      </form>

      <div class="card-footer">
        Sharif Group &mdash; Executive Management Portal
      </div>

    </div>
  </div>

  <script>
    (function () {
      'use strict';

      // ── If already logged in, skip to dashboard ──────────────────────────
      (function checkExistingSession() {
        try {
          const user = JSON.parse(sessionStorage.getItem('sgcms_auth') || localStorage.getItem('sgcms_auth'));
          const token = sessionStorage.getItem('sgcms_token') || localStorage.getItem('sgcms_token');
          if (user && token) {
            window.location.replace('dashboard.html');
          }
        } catch (_) { }
      })();

      // ── Elements ──────────────────────────────────────────────────────────
      const form = document.getElementById('loginForm');
      const emailEl = document.getElementById('emailField');
      const passEl = document.getElementById('passField');
      const btn = document.getElementById('signInBtn');
      const alertBox = document.getElementById('alertError');
      const alertMsg = document.getElementById('alertMsg');
      const toggleBtn = document.getElementById('togglePass');
      const toggleIco = document.getElementById('toggleIcon');

      // ── Password visibility toggle ────────────────────────────────────────
      toggleBtn.addEventListener('click', function () {
        const hidden = passEl.type === 'password';
        passEl.type = hidden ? 'text' : 'password';
        toggleIco.className = hidden ? 'fa-regular fa-eye-slash' : 'fa-regular fa-eye';
      });

      // ── Show / hide error ─────────────────────────────────────────────────
      function showError(msg) {
        alertMsg.textContent = msg || 'Incorrect email or password.';
        alertBox.classList.add('show');
      }
      function hideError() {
        alertBox.classList.remove('show');
      }

      // ── Loading state ─────────────────────────────────────────────────────
      function setLoading(on) {
        btn.disabled = on;
        btn.classList.toggle('loading', on);
      }

      // ── Form submit ───────────────────────────────────────────────────────
      form.addEventListener('submit', async function (e) {
        e.preventDefault();
        hideError();

        const email = emailEl.value.trim().toLowerCase();
        const password = passEl.value.trim();

        if (!email || !password) {
          showError('Please enter your email and password.');
          return;
        }

        setLoading(true);

        try {
          const res = await fetch('/admin/api/auth.php?action=login', {
            method: 'POST',
            credentials: 'include',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
          });

          let data = {};
          try { data = await res.json(); } catch (_) { }

          if (res.ok && data && data.success) {
            // Persist session
            const authData = JSON.stringify(data.user);
            sessionStorage.setItem('sgcms_auth', authData);
            sessionStorage.setItem('sgcms_user', authData);
            localStorage.setItem('sgcms_auth', authData);
            localStorage.setItem('sgcms_user', authData);
            if (data.token) {
              sessionStorage.setItem('sgcms_token', data.token);
              localStorage.setItem('sgcms_token', data.token);
            }
            window.location.replace('/admin/dashboard.html');
            return;
          }

          // If on static hosting (e.g. Vercel preview returning 405 Method Not Allowed), allow master admin credentials
          if (res.status === 405 || !res.ok) {
            if (email === 'admin@sharifgroup.ae' && password === 'Sharif_Admin@2026!Sec#x9') {
              const previewUser = { name: 'Alireza Sharif', email: 'admin@sharifgroup.ae', role: 'Super Admin' };
              const previewStr = JSON.stringify(previewUser);
              const previewToken = 'sgcms_preview_' + Date.now();
              sessionStorage.setItem('sgcms_auth', previewStr);
              sessionStorage.setItem('sgcms_user', previewStr);
              sessionStorage.setItem('sgcms_token', previewToken);
              localStorage.setItem('sgcms_auth', previewStr);
              localStorage.setItem('sgcms_user', previewStr);
              localStorage.setItem('sgcms_token', previewToken);
              window.location.replace('/admin/dashboard.html');
              return;
            }
          }

          setLoading(false);
          showError((data && data.error) ? data.error : 'Incorrect email or password. Please try again.');
        } catch (err) {
          // If offline / network error on static hosting, allow master credentials
          if (email === 'admin@sharifgroup.ae' && password === 'Sharif_Admin@2026!Sec#x9') {
            const previewUser = { name: 'Alireza Sharif', email: 'admin@sharifgroup.ae', role: 'Super Admin' };
            const previewStr = JSON.stringify(previewUser);
            const previewToken = 'sgcms_preview_' + Date.now();
            sessionStorage.setItem('sgcms_auth', previewStr);
            sessionStorage.setItem('sgcms_user', previewStr);
            sessionStorage.setItem('sgcms_token', previewToken);
            localStorage.setItem('sgcms_auth', previewStr);
            localStorage.setItem('sgcms_user', previewStr);
            localStorage.setItem('sgcms_token', previewToken);
            window.location.replace('/admin/dashboard.html');
            return;
          }
          setLoading(false);
          showError('Connection error. Please check your network and try again.');
        }
      });

      // ── Clear error on input ──────────────────────────────────────────────
      [emailEl, passEl].forEach(function (el) {
        el.addEventListener('input', hideError);
      });

    })();
  </script>

</body>

</html>
