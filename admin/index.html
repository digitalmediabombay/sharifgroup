<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CMS Dashboard | Admin Login | Sharif Group</title>
<link rel="icon" href="/assets/images/shariftrip-logo-1.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<style>
  :root {
    --gold: #B38E5D;
    --gold-dark: #977344;
    --gold-light: #C5A880;
    --gold-dim: rgba(179, 142, 93, 0.12);
    --gold-glow: rgba(179, 142, 93, 0.25);
    --text-main: #0F172A;
    --text-muted: #64748B;
    --border-light: #E2E8F0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  html, body {
    height: 100%;
    min-height: 100vh;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background-color: #FFFFFF;
    color: var(--text-main);
    overflow-x: hidden;
  }

  /* Two-column Split Layout */
  .auth-wrapper {
    display: flex;
    min-height: 100vh;
    width: 100%;
  }

  /* ── LEFT PANEL: Big Logo & Welcome Text ── */
  .left-panel {
    flex: 1.15;
    background: linear-gradient(150deg, #FBF9F5 0%, #F6F1EA 50%, #F0E8DC 100%);
    border-right: 1px solid #EDE4D8;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 60px 48px;
    position: relative;
    text-align: center;
  }

  .left-content {
    max-width: 540px;
    display: flex;
    flex-direction: column;
    align-items: center;
    animation: fadeScale 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }

  @keyframes fadeScale {
    from { opacity: 0; transform: scale(0.95) translateY(12px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }

  /* Extra Large Logo */
  .logo-box {
    margin-bottom: 32px;
    display: flex;
    justify-content: center;
  }

  .big-brand-logo {
    height: 130px;
    width: auto;
    max-width: 380px;
    object-fit: contain;
    filter: drop-shadow(0 8px 24px rgba(179, 142, 93, 0.16));
    transition: transform 0.35s ease;
  }

  .big-brand-logo:hover {
    transform: scale(1.03);
  }

  /* Welcome to CMS Dashboard Headline */
  .welcome-heading {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: clamp(34px, 3.8vw, 48px);
    font-weight: 700;
    line-height: 1.18;
    color: #0F172A;
    letter-spacing: -0.02em;
    margin-bottom: 14px;
  }

  .welcome-heading span {
    background: linear-gradient(135deg, #977344 0%, #B38E5D 50%, #C5A880 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    display: inline-block;
  }

  /* Elegant Divider */
  .gold-divider {
    width: 64px;
    height: 3px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    border-radius: 999px;
    margin: 10px auto 0;
  }

  /* ── RIGHT PANEL: Pure White Bright Screen ── */
  .right-panel {
    flex: 1;
    background-color: #FFFFFF;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 48px 32px;
    position: relative;
  }

  /* Pristine Floating Login Card */
  .login-card {
    width: 100%;
    max-width: 420px;
    background: #FFFFFF;
    border: 1px solid #E8EEF5;
    border-radius: 20px;
    padding: 42px 36px;
    box-shadow: 0 20px 48px -12px rgba(15, 23, 42, 0.08), 0 1px 3px rgba(15, 23, 42, 0.04);
    animation: cardSlideIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }

  @keyframes cardSlideIn {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .login-header {
    margin-bottom: 26px;
  }

  .login-header h2 {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: 28px;
    font-weight: 700;
    color: #0F172A;
    margin-bottom: 6px;
    letter-spacing: -0.01em;
  }

  .login-header p {
    color: var(--text-muted);
    font-size: 13px;
    line-height: 1.5;
  }

  /* Inputs */
  .form-group {
    margin-bottom: 18px;
  }

  .form-label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: #334155;
    margin-bottom: 8px;
  }

  .input-wrapper {
    position: relative;
    display: flex;
    align-items: center;
  }

  .input-icon {
    position: absolute;
    left: 16px;
    color: #94A3B8;
    font-size: 14px;
    transition: color 0.2s;
    pointer-events: none;
  }

  .cms-input {
    width: 100%;
    background: #F8FAFC;
    border: 1px solid #CBD5E1;
    border-radius: 12px;
    padding: 13px 16px 13px 44px;
    font-size: 14px;
    color: #0F172A;
    outline: none;
    font-family: inherit;
    transition: all 0.25s ease;
  }

  .cms-input:focus {
    background: #FFFFFF;
    border-color: var(--gold);
    box-shadow: 0 0 0 4px var(--gold-glow);
  }

  .input-wrapper:focus-within .input-icon {
    color: var(--gold-dark);
  }

  .toggle-pwd-btn {
    position: absolute;
    right: 14px;
    background: none;
    border: none;
    cursor: pointer;
    color: #94A3B8;
    padding: 6px;
    font-size: 14px;
    transition: color 0.2s;
  }

  .toggle-pwd-btn:hover {
    color: var(--gold-dark);
  }

  /* Submit Button */
  .btn-submit {
    width: 100%;
    background: linear-gradient(135deg, #C5A880 0%, #B38E5D 50%, #977344 100%);
    border: none;
    border-radius: 12px;
    color: #FFFFFF;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.02em;
    padding: 14px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    box-shadow: 0 8px 20px -4px rgba(179, 142, 93, 0.4);
    margin-top: 10px;
  }

  .btn-submit:hover {
    background: linear-gradient(135deg, #D4BA94 0%, #C5A880 50%, #A5804E 100%);
    box-shadow: 0 12px 26px -4px rgba(179, 142, 93, 0.55);
    transform: translateY(-1px);
  }

  .btn-submit:active {
    transform: translateY(0);
  }

  .btn-submit:disabled {
    opacity: 0.75;
    cursor: not-allowed;
    transform: none;
  }

  /* Demo Credentials Quick-Fill */
  .demo-box {
    margin-top: 22px;
    background: #FDFBF8;
    border: 1px dashed rgba(179, 142, 93, 0.38);
    border-radius: 12px;
    padding: 12px 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }

  .demo-info-title {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--gold-dark);
    margin-bottom: 2px;
  }

  .demo-info-details {
    font-family: 'SFMono-Regular', Consolas, Menlo, monospace;
    font-size: 11px;
    color: #475569;
  }

  .btn-autofill {
    background: #FFFFFF;
    border: 1px solid rgba(179, 142, 93, 0.35);
    color: var(--gold-dark);
    padding: 6px 12px;
    border-radius: 8px;
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.2s;
  }

  .btn-autofill:hover {
    background: var(--gold);
    color: #FFFFFF;
    border-color: var(--gold);
  }

  /* Alerts */
  .alert-box {
    display: none;
    align-items: center;
    gap: 10px;
    padding: 12px 14px;
    border-radius: 10px;
    font-size: 13px;
    margin-bottom: 18px;
    animation: fadeIn 0.3s ease;
  }

  .alert-error {
    background: #FEF2F2;
    border: 1px solid #FCA5A5;
    color: #DC2626;
  }

  .alert-success {
    background: #F0FDF4;
    border: 1px solid #86EFAC;
    color: #16A34A;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(-4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20%, 60% { transform: translateX(-6px); }
    40%, 80% { transform: translateX(6px); }
  }
  .shake { animation: shake 0.45s ease; }

  /* Mobile Top Branding */
  .mobile-brand-bar {
    display: none;
    text-align: center;
    padding: 24px 20px 0;
  }

  .mobile-brand-bar .big-brand-logo {
    height: 70px;
    margin: 0 auto 10px;
  }

  .mobile-welcome-text {
    font-family: 'Playfair Display', serif;
    font-size: 24px;
    font-weight: 700;
    color: #0F172A;
    margin-bottom: 16px;
  }

  /* Responsive Rules */
  @media (max-width: 1024px) {
    .left-panel { display: none; }
    .mobile-brand-bar { display: block; }
    .right-panel {
      padding: 20px 16px 36px;
      flex-direction: column;
    }
    .login-card {
      padding: 30px 22px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
    }
  }
</style>
</head>
<body>

<div class="auth-wrapper">

  <!-- ── LEFT PANEL: BIGGER LOGO & "WELCOME TO CMS DASHBOARD" ── -->
  <aside class="left-panel" id="left-panel">
    <div class="left-content">
      
      <!-- Big Logo -->
      <div class="logo-box">
        <a href="../index.html" title="Sharif Group Home">
          <img src="/assets/images/shariftrip-logo-2.svg" 
               alt="Sharif Group" 
               class="big-brand-logo"
               id="main-brand-logo">
        </a>
      </div>

      <!-- Welcome to CMS Dashboard Headline -->
      <h1 class="welcome-heading">
        Welcome to<br>
        <span>CMS Dashboard</span>
      </h1>

      <div class="gold-divider"></div>

    </div>
  </aside>

  <!-- ── RIGHT PANEL: BRIGHT WHITE SCREEN ── -->
  <main class="right-panel">
    
    <!-- Mobile Brand Display (< 1024px) -->
    <div class="mobile-brand-bar">
      <img src="/assets/images/shariftrip-logo-2.svg" 
           alt="Sharif Group" 
           class="big-brand-logo">
      <h2 class="mobile-welcome-text">Welcome to <span style="color:var(--gold)">CMS Dashboard</span></h2>
    </div>

    <!-- Login Card -->
    <div class="login-card" id="login-card">
      
      <div class="login-header">
        <h2>Sign In</h2>
        <p>Enter your administrative credentials to access your live content suite.</p>
      </div>

      <!-- Alert Boxes -->
      <div id="error-box" class="alert-box alert-error">
        <i class="fa-solid fa-circle-exclamation"></i>
        <span id="error-text">Invalid login credentials.</span>
      </div>

      <div id="success-box" class="alert-box alert-success">
        <i class="fa-solid fa-circle-check"></i>
        <span id="success-text">Credentials verified. Launching CMS Dashboard…</span>
      </div>

      <!-- Login Form -->
      <form id="login-form" onsubmit="handleLogin(event)">

        <!-- Email -->
        <div class="form-group">
          <label class="form-label" for="login-email">Corporate Email Address</label>
          <div class="input-wrapper">
            <i class="fa-regular fa-envelope input-icon"></i>
            <input type="email" 
                   id="login-email" 
                   class="cms-input" 
                   placeholder="admin@sharifgroup.ae" 
                   required 
                   autocomplete="email">
          </div>
        </div>

        <!-- Password -->
        <div class="form-group" style="margin-bottom: 22px;">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
            <label class="form-label" for="login-password" style="margin-bottom:0">Password</label>
            <span style="font-size:11px;color:var(--gold-dark);font-weight:600;cursor:pointer" onclick="fillDemoCreds()">Need demo login?</span>
          </div>
          <div class="input-wrapper">
            <i class="fa-solid fa-lock input-icon"></i>
            <input type="password" 
                   id="login-password" 
                   class="cms-input" 
                   style="padding-right: 44px;" 
                   placeholder="Enter your master password" 
                   required 
                   autocomplete="current-password">
            <button type="button" 
                    class="toggle-pwd-btn" 
                    onclick="togglePassword()" 
                    title="Toggle password view" 
                    aria-label="Toggle password view">
              <i class="fa-regular fa-eye" id="eye-icon"></i>
            </button>
          </div>
        </div>

        <!-- Submit Button -->
        <button type="submit" id="login-btn" class="btn-submit">
          <span id="btn-label">Access CMS Dashboard</span>
          <i class="fa-solid fa-arrow-right" id="btn-icon"></i>
        </button>
      </form>

      <!-- Quick Demo Credentials Box -->
      <div class="demo-box">
        <div>
          <div class="demo-info-title"><i class="fa-solid fa-key" style="margin-right:4px"></i> Demo Credentials</div>
          <div class="demo-info-details">admin@sharifgroup.ae &bull; SharifCMS@2026</div>
        </div>
        <button type="button" class="btn-autofill" onclick="fillDemoCreds()">
          <i class="fa-solid fa-bolt" style="margin-right:3px"></i> Autofill
        </button>
      </div>

    </div>
  </main>

</div>

<script src="cms.js"></script>
<script>
// Redirect if already authed
if (window.CMS && window.CMS.Auth && window.CMS.Auth.isAuthenticated()) {
  window.location.href = 'dashboard.html';
}

// Password Reveal Toggle
function togglePassword() {
  const pwdInput = document.getElementById('login-password');
  const eyeIcon = document.getElementById('eye-icon');
  if (pwdInput.type === 'password') {
    pwdInput.type = 'text';
    eyeIcon.className = 'fa-regular fa-eye-slash';
  } else {
    pwdInput.type = 'password';
    eyeIcon.className = 'fa-regular fa-eye';
  }
}

// 1-Click Autofill for Testing & Demo
function fillDemoCreds() {
  document.getElementById('login-email').value = 'admin@sharifgroup.ae';
  document.getElementById('login-password').value = 'SharifCMS@2026';
  const card = document.getElementById('login-card');
  card.style.transform = 'scale(1.01)';
  setTimeout(() => { card.style.transform = 'none'; }, 180);
}

// Login Submission Handler
function handleLogin(e) {
  e.preventDefault();
  const email = document.getElementById('login-email').value.trim();
  const pwd = document.getElementById('login-password').value;
  const btn = document.getElementById('login-btn');
  const btnLabel = document.getElementById('btn-label');
  const btnIcon = document.getElementById('btn-icon');
  const errorBox = document.getElementById('error-box');
  const errorText = document.getElementById('error-text');
  const successBox = document.getElementById('success-box');
  const loginCard = document.getElementById('login-card');

  // Loading State
  btn.disabled = true;
  btnLabel.textContent = 'Verifying Credentials…';
  btnIcon.className = 'fa-solid fa-spinner fa-spin';
  errorBox.style.display = 'none';
  successBox.style.display = 'none';

  setTimeout(() => {
    let result = { success: false, error: 'Authentication engine not loaded.' };
    if (window.CMS && window.CMS.Auth) {
      result = window.CMS.Auth.login(email, pwd);
    } else if (email.toLowerCase() === 'admin@sharifgroup.ae' && pwd === 'SharifCMS@2026') {
      result = { success: true };
    }

    if (result.success) {
      successBox.style.display = 'flex';
      btnLabel.textContent = 'Access Authorized';
      btnIcon.className = 'fa-solid fa-check';
      btn.style.background = 'linear-gradient(135deg, #16a34a, #15803d)';
      btn.style.boxShadow = '0 10px 24px rgba(22, 163, 74, 0.4)';
      
      setTimeout(() => {
        window.location.href = 'dashboard.html';
      }, 700);
    } else {
      btn.disabled = false;
      btnLabel.textContent = 'Access CMS Dashboard';
      btnIcon.className = 'fa-solid fa-arrow-right';
      errorText.textContent = result.error || 'Incorrect email or password.';
      errorBox.style.display = 'flex';
      loginCard.classList.add('shake');
      setTimeout(() => loginCard.classList.remove('shake'), 500);
    }
  }, 600);
}
</script>
</body>
</html>
