<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Become a Partner Section Preview</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts: Inter & Playfair Display -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,700;1,400&display=swap" rel="stylesheet">
    
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Tailwind Custom Configuration -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'luxury-gold': '#C5A880',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['"Playfair Display"', 'Georgia', 'serif'],
                    }
                }
            }
        }
    </script>
</head>
<!-- Changed page body background from #FAF6EE (warm cream/yellow) to pure white -->
<body class="bg-white min-h-screen flex flex-col justify-center">

    <!-- BECOME A PARTNER HIGHLIGHT BAR (COMPACT & ELEVATED) -->
    <!-- Changed outer section background behind the card from #FAF6EE to pure white -->
    <section class="py-16 px-6 bg-white border-b border-neutral-200/80 relative overflow-hidden">
        <div class="max-w-7xl mx-auto relative rounded-[2.5rem] overflow-hidden border border-luxury-gold/50 hover:border-luxury-gold transition-all duration-500 shadow-[0_20px_50px_-15px_rgba(7,14,26,0.4)] p-8 sm:p-12 flex flex-col md:flex-row items-center justify-between gap-8 bg-[#070E1A] group">
            
            <!-- Background Executive Handshake Image with Subtle Hover Zoom (Unchanged) -->
            <div class="absolute inset-0 bg-cover bg-center opacity-30 transition-transform duration-700 group-hover:scale-105 pointer-events-none" 
                 style="background-image: url('https://images.unsplash.com/photo-1521791136064-7986c2920216?auto=format&amp;fit=crop&amp;q=80&amp;w=1200');">
            </div>
            
            <!-- Multi-layered Luxury Dark Overlay + Subtle Gold Corner Glow (Unchanged) -->
            <div class="absolute inset-0 bg-gradient-to-r from-[#050B14]/98 via-[#070E1A]/90 to-[#050B14]/75 pointer-events-none"></div>
            <div class="absolute -right-16 -bottom-16 w-64 h-64 bg-luxury-gold/10 rounded-full blur-3xl pointer-events-none group-hover:bg-luxury-gold/20 transition-all duration-700"></div>
            
            <!-- Left Content Area (Exact Compact Scale & Simple English) -->
            <div class="relative z-10 space-y-3 text-center md:text-left max-w-2xl">
                <span class="text-[10px] uppercase tracking-[0.25em] text-luxury-gold font-bold flex items-center justify-center md:justify-start gap-2">
                    <i class="fa-solid fa-handshake text-luxury-gold"></i> 
                    <span data-i18n="partnerBar.badge">GLOBAL PARTNERSHIP</span>
                </span>
                
                <h2 class="font-serif text-2xl md:text-3xl font-bold text-white">
                    <span data-i18n="partnerBar.heading">Grow With Us:</span> 
                    <span class="italic text-[#C5A880] font-serif font-normal" data-i18n="partnerBar.headingItalic">Become a Partner</span>
                </h2>
                
                <p class="text-xs sm:text-sm text-neutral-300 font-light leading-relaxed" data-i18n="partnerBar.description">
                    Partner with Sharif Group Dubai to offer your clients second citizenship and residency programs—backed by our expert team and high commissions.
                </p>
            </div>
            
            <!-- Right CTA Button -->
            <div class="relative z-10 shrink-0">
                <a class="inline-flex items-center gap-2.5 px-7 py-3.5 rounded-full bg-[#786142] text-white text-xs font-bold uppercase tracking-widest hover:bg-luxury-gold hover:text-[#070E1A] transition-all duration-300 shadow-xl hover:shadow-luxury-gold/20 whitespace-nowrap premium-btn-hover group/btn" href="/partners/">
                    <span data-i18n="partnerBar.cta">Become a Partner</span> 
                    <i class="fa-solid fa-arrow-right text-[10px] transition-transform duration-300 group-hover/btn:translate-x-1"></i>
                </a>
            </div>
            
        </div>
    </section>

</body>
</html>
